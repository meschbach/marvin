apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slacker
spec:
  template:
    spec:
      containers:
      - name: slacker
        env:
        - name: LOG_LEVEL
          value: "info"
        - name: MARVIN_CONFIG
          value: "/config/marvin-staging.hcl"
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: slacker-staging-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      resources:
        requests:
          storage: 5Gi