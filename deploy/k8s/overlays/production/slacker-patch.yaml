apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slacker
spec:
  template:
    spec:
      containers:
      - name: slacker
        env:
        - name: LOG_LEVEL
          value: "warn"
        - name: MARVIN_CONFIG
          value: "/config/marvin-production.hcl"
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: slacker-production-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      resources:
        requests:
          storage: 50Gi