apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slacker
spec:
  template:
    spec:
      containers:
      - name: slacker
        env:
        - name: LOG_LEVEL
          value: "debug"
        - name: MARVIN_CONFIG
          value: "/config/marvin-dev.hcl"
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: config
        configMap:
          name: slacker-dev-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      resources:
        requests:
          storage: 1Gi