apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slacker
  labels:
    app.kubernetes.io/name: slacker
    app.kubernetes.io/component: bot
    app.kubernetes.io/part-of: marvin
spec:
  serviceName: slacker
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slacker
      app.kubernetes.io/component: bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slacker
        app.kubernetes.io/component: bot
        app.kubernetes.io/part-of: marvin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: slacker
        image: slacker:latest
        imagePullPolicy: IfNotPresent
#        ports:
#        - name: http
#          containerPort: 8080
#          protocol: TCP
        env:
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slacker-secrets
              key: slack-bot-token
        - name: SLACK_APP_TOKEN
          valueFrom:
            secretKeyRef:
              name: slacker-secrets
              key: slack-app-token
        - name: MARVIN_CONFIG
          value: "/config/marvin.hcl"
        - name: MARVIN_SESSION_PATH
          value: "/data/sessions"
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /data
#        resources:
#          limits:
#            cpu: 500m
#            memory: 512Mi
#          requests:
#            cpu: 100m
#            memory: 128Mi
#        livenessProbe:
#          httpGet:
#            path: /health
#            port: http
#          initialDelaySeconds: 30
#          periodSeconds: 10
#          timeoutSeconds: 5
#          failureThreshold: 3
#        readinessProbe:
#          httpGet:
#            path: /ready
#            port: http
#          initialDelaySeconds: 5
#          periodSeconds: 5
#          timeoutSeconds: 3
#          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: slacker-config
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/name: slacker
        app.kubernetes.io/component: bot
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi